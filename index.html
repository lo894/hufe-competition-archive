<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>湖南财政经济学院 · 竞赛成果资料库</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --ink:#1e293b; --muted:#64748b;
    --primary:#2563eb; --primary-soft:#eff6ff; --accent:#06b6d4;
    --gold:#f59e0b; --line:#e2e8f0;
    --lv-gj:'#2563eb'; --lv-sf:'#06b6d4'; --lv-xh:'#94a3b8';
    --lv-gj2:'#7c3aed'; --lv-cs:'#f59e0b'; --lv-qt:'#cbd5e1';
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px}
  a{color:var(--primary);text-decoration:none}
  a:hover{text-decoration:underline}
  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#2563eb,#06b6d4);
          color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;
          box-shadow:0 2px 12px rgba(37,99,235,.18)}
  .brand{font-weight:700;font-size:18px;letter-spacing:.3px}
  .brand .sub{font-weight:400;opacity:.85;font-size:12px;display:block;margin-top:2px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .tabs button{border:0;background:rgba(255,255,255,.16);color:#fff;padding:8px 14px;border-radius:999px;
                cursor:pointer;font-size:14px;transition:.2s}
  .tabs button:hover{background:rgba(255,255,255,.3)}
  .tabs button.active{background:#fff;color:var(--primary);font-weight:600}
  main{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
  .tab-pane{display:none;animation:fade .25s ease}
  .tab-pane.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
        box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .card h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px}
  .card h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--primary)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
       position:relative;overflow:hidden}
  .kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;
              background:var(--primary-soft);opacity:.7}
  .kpi .num{font-size:30px;font-weight:800;color:var(--primary);position:relative}
  .kpi .lab{color:var(--muted);font-size:13px;position:relative}
  .kpi.accent .num{color:var(--accent)}
  .kpi.gold .num{color:var(--gold)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .grid2b{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
  @media(max-width:880px){.grid2,.grid2b{grid-template-columns:1fr}}
  .filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:12px;color:var(--muted)}
  select,input[type=text],input[type=number]{padding:8px 10px;border:1px solid var(--line);border-radius:9px;
       font-size:14px;background:#fff;color:var(--ink);min-width:130px}
  .chk{display:flex;gap:8px;flex-wrap:wrap}
  .chk label{display:flex;align-items:center;gap:4px;font-size:13px;background:var(--primary-soft);
             padding:5px 10px;border-radius:999px;cursor:pointer;color:#1d4ed8}
  .chk input{accent-color:var(--primary)}
  .btn{border:0;background:var(--primary);color:#fff;padding:9px 16px;border-radius:9px;cursor:pointer;
       font-size:14px;font-weight:600}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:13px;background:#fafcff;position:sticky;top:0}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--primary-soft)}
  .tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .lv-国家级{background:#dbeafe;color:#1d4ed8}
  .lv-省级{background:#cffafe;color:#0e7490}
  .lv-校级{background:#f1f5f9;color:#475569}
  .lv-国际级{background:#ede9fe;color:#6d28d9}
  .lv-市级{background:#fef3c7;color:#b45309}
  .lv-其他{background:#f8fafc;color:#64748b}
  .pill{display:inline-block;background:#eef2ff;color:#4338ca;padding:1px 8px;border-radius:8px;font-size:12px;margin:2px}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px}
  .detail{padding:14px 16px;background:#fafcff;border-left:3px solid var(--primary)}
  .detail .row{margin:4px 0}
  .empty{text-align:center;color:var(--muted);padding:30px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:8px 16px;cursor:pointer;font-size:14px}
  .seg button.active{background:var(--primary);color:#fff}
  .timeline{position:relative;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl-item{position:relative;margin-bottom:18px}
  .tl-item::before{content:"";position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;
                   background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary-soft)}
  .tl-yr{font-weight:700;color:var(--primary)}
  svg{display:block;max-width:100%}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 14px;
        font-size:13px;margin:14px 0}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px;border-top:1px solid var(--line)}
  .bars-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
  .bars-row .nm{width:170px;text-align:right;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bars-row .bar{height:16px;background:linear-gradient(90deg,#2563eb,#06b6d4);border-radius:4px;min-width:3px}
  .bars-row .vl{color:var(--ink);font-weight:600}
  .prose{font-size:14.5px}
  .prose h4{margin:18px 0 6px;color:var(--primary)}
  .prose ul{padding-left:20px;margin:6px 0}
  .prose li{margin:4px 0}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
  .org{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .org .oh{font-weight:700;color:var(--primary);display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .org .badge{margin-left:auto;font-size:11px;font-weight:600;background:var(--primary-soft);color:#1d4ed8;
             padding:2px 9px;border-radius:999px;white-space:nowrap}
  .org .badge.hot{background:#fff1f2;color:#e11d48}
  .org ul{padding-left:18px;margin:6px 0 0;font-size:13px}
  .org li{margin:3px 0;color:#334155}
  .lead-banner{background:linear-gradient(120deg,#eff6ff,#ecfeff);border:1px solid #dbeafe;border-radius:12px;
               padding:14px 18px;margin-bottom:18px}
  .lead-banner b{color:var(--primary)}
  .skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:880px){.skill-grid{grid-template-columns:1fr}}
  .goal-chain{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin:6px 0 2px}
  .goal-node{flex:1;min-width:210px;background:linear-gradient(135deg,#eff6ff,#ecfeff);border:1px solid #dbeafe;border-radius:12px;padding:14px 16px}
  .goal-node .gn-t{font-weight:700;color:var(--primary);font-size:15px;display:flex;align-items:center;gap:6px}
  .goal-node .gn-d{font-size:13px;color:#334155;margin-top:5px}
  .goal-arrow{display:flex;align-items:center;color:var(--accent);font-size:22px;font-weight:800;padding:0 4px}
  @media(max-width:680px){.goal-arrow{transform:rotate(90deg)}}
  .tpl{position:relative;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px 16px;font-size:13.5px;line-height:1.75;
       white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tpl .copy{position:absolute;top:8px;right:8px;border:1px solid #334155;background:#1e293b;color:#cbd5e1;border-radius:7px;
             padding:3px 10px;font-size:12px;cursor:pointer}
  .tpl .copy:hover{background:#334155}
  .resource-4{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:880px){.resource-4{grid-template-columns:1fr}}
  .res-box{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px}
  .res-box.warn{border-left-color:var(--gold)}
  .res-box h5{margin:0 0 6px;color:var(--ink);font-size:14px}
  .res-box ul{margin:0;padding-left:18px;font-size:13px}
  .res-box li{margin:3px 0;color:#334155}
  .ch{font-weight:700;color:var(--primary);margin:16px 0 4px}
  .fac-det{border:1px solid var(--line);border-radius:10px;padding:6px 14px;margin:8px 0;background:#fff}
  .fac-det summary{cursor:pointer;padding:4px 0;color:#1e293b}
  .fac-det summary:hover{color:var(--primary)}
  .fac-list{padding:8px 0 6px;line-height:2.1}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">🐾 湖南财政经济学院 · 竞赛成果资料库
    <span class="sub">建校 1933 · 官网公示竞赛 / 师生 / 科研成果一站式查询</span>
  </div>
  <nav class="tabs">
    <button data-tab="overview" class="active">总览看板</button>
    <button data-tab="search">竞赛查询</button>
    <button data-tab="analysis">近三年分析</button>
    <button data-tab="research">科研成果</button>
    <button data-tab="timeline">校史时间线</button>
    <button data-tab="guide">新生参赛规划</button>
    <button data-tab="roadmap">参赛·就业规划</button>
    <button data-tab="resources">资源导航</button>
  </nav>
</header>

<main>
  <section id="overview" class="tab-pane active"></section>
  <section id="search" class="tab-pane"></section>
  <section id="analysis" class="tab-pane"></section>
  <section id="research" class="tab-pane"></section>
  <section id="timeline" class="tab-pane"></section>
  <section id="guide" class="tab-pane"></section>
  <section id="roadmap" class="tab-pane"></section>
  <section id="resources" class="tab-pane"></section>
</main>

<footer>
  数据来源：湖南财政经济学院官方网站（新闻网 / 各学院及职能部门子站）公示内容整合 · 生成于 2026-08-09<br>
  本库为公开信息汇编，仅供研究参考；师生名单与奖项以学校官方发布为准。
</footer>

<script src="data.js"></script>
<script src="faculty.js"></script>
<script>
const D = window.HUFE_DATA;
const {meta, records, papers, patents} = D;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* ---------- 工具 ---------- */
const uniq = a => [...new Set(a.filter(Boolean))];
function countBy(arr, fn){const m={};for(const x of arr){const k=fn(x);if(k)m[k]=(m[k]||0)+1;}return m;}
function topN(obj, n){return Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const LV_COLOR={'国家级':'#2563eb','省级':'#06b6d4','校级':'#94a3b8','国际级':'#7c3aed','市级':'#f59e0b','其他':'#cbd5e1'};

/* ---------- Tab 切换 ---------- */
$$('.tabs button').forEach(b=>b.onclick=()=>{
  $$('.tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  $$('.tab-pane').forEach(p=>p.classList.remove('active'));
  $('#'+b.dataset.tab).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ================= 总览 ================= */
function renderOverview(){
  const byYear = countBy(records, r=>r.year);
  const years = Object.keys(byYear).map(Number).sort((a,b)=>a-b);
  const byLevel = meta.level_dist;
  const byCollege = countBy(records.flatMap(r=>r.college.length?r.college:[null]), x=>x||'未注明');
  const bySeries = countBy(records.map(r=>r.series||'未命名赛事'), x=>x);
  const html = `
  <div class="kpis">
    <div class="kpi"><div class="num">${meta.total_records}</div><div class="lab">获奖记录总数（${meta.data_start_year}–2026）</div></div>
    <div class="kpi accent"><div class="num">${meta.recent_records}</div><div class="lab">近三年（2024–2026）记录</div></div>
    <div class="kpi gold"><div class="num">${meta.total_students}</div><div class="lab">参与学生（去重）</div></div>
    <div class="kpi"><div class="num">${meta.total_teachers}</div><div class="lab">指导老师（去重）</div></div>
    <div class="kpi accent"><div class="num">${meta.total_papers}</div><div class="lab">发表论文（官网公示）</div></div>
    <div class="kpi"><div class="num">${meta.total_patents}</div><div class="lab">专利（官网公示）</div></div>
  </div>
  <div class="grid2b">
    <div class="card">
      <h3><span class="dot"></span>历年获奖记录趋势</h3>
      ${vBars(years.map(y=>({label:String(y),value:byYear[y]})), {color:'#2563eb'})}
      <div class="small muted">注：官网系统化公示始于 2009 年前后，早期年份样本较少。</div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>奖项级别构成</h3>
      ${donut(Object.entries(byLevel).map(([k,v])=>({label:k,value:v})), LV_COLOR)}
    </div>
  </div>
  <div class="grid2" style="margin-top:18px">
    <div class="card">
      <h3><span class="dot"></span>学院获奖 TOP 12</h3>
      ${hBars(topN(byCollege,12))}
    </div>
    <div class="card">
      <h3><span class="dot"></span>热门赛事系列 TOP 12</h3>
      ${hBars(topN(bySeries,12))}
    </div>
  </div>
  <div class="note">📌 说明：表格型记录含具体师生名单（共 ${meta.total_students} 名学生、${meta.total_teachers} 名老师）；
  概况型记录（如「我校 N 项成果获奖」）仅含年份/级别/学院，已在查询中保留但无逐人名单。</div>
  `;
  $('#overview').innerHTML = html;
}

/* 纵向柱状（年份） */
function vBars(items, {color='#2563eb'}={}){
  if(!items.length) return '<div class="empty">暂无数据</div>';
  const max=Math.max(...items.map(i=>i.value));
  const w=560, h=240, pad=30, bw=Math.min(34,(w-pad*2)/items.length-6);
  const step=(w-pad*2)/items.length;
  let s=`<svg viewBox="0 0 ${w} ${h+20}" preserveAspectRatio="xMidYMid meet">`;
  items.forEach((it,i)=>{
    const bh=max? it.value/max*(h-pad*2):0;
    const x=pad+step*i+(step-bw)/2;
    const y=h-pad-bh;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${color}"/>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" font-size="11" text-anchor="middle" fill="#334155">${it.value}</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(h-pad+15).toFixed(1)}" font-size="10.5" text-anchor="middle" fill="#64748b">${esc(it.label)}</text>`;
  });
  s+=`<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#e2e8f0"/>`;
  s+=`</svg>`;
  return s;
}

/* 环形图 */
function donut(items, colorMap){
  if(!items.length) return '<div class="empty">暂无数据</div>';
  const total=items.reduce((a,b)=>a+b.value,0);
  const R=70,C=90,c=2*Math.PI*R; let off=0;
  let s=`<svg viewBox="0 0 180 200" preserveAspectRatio="xMidYMid meet">`;
  items.forEach(it=>{
    const frac=it.value/total; const len=frac*c;
    const col=(colorMap&&colorMap[it.label])||'#94a3b8';
    s+=`<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${col}" stroke-width="22"
         stroke-dasharray="${len.toFixed(1)} ${(c-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"
         transform="rotate(-90 ${C} ${C})"/>`;
    off+=len;
  });
  s+=`<text x="${C}" y="${C-4}" font-size="20" font-weight="800" text-anchor="middle" fill="#1e293b">${total}</text>`;
  s+=`<text x="${C}" y="${C+14}" font-size="11" text-anchor="middle" fill="#64748b">总计</text></svg>`;
  s+=`<div class="legend">`+items.map(it=>{
    const col=(colorMap&&colorMap[it.label])||'#94a3b8';
    const pct=(it.value/total*100).toFixed(1);
    return `<span><i style="background:${col}"></i>${esc(it.label)} ${it.value} (${pct}%)</span>`;
  }).join('')+`</div>`;
  return s;
}

/* 横向条形（TOP N） */
function hBars(items){
  if(!items.length) return '<div class="empty">暂无数据</div>';
  const max=Math.max(...items.map(i=>i[1]));
  return items.map(([nm,v])=>{
    const pct=max?Math.round(v/max*100):0;
    return `<div class="bars-row"><span class="nm" title="${esc(nm)}">${esc(nm)}</span>
      <span class="bar" style="width:${Math.max(pct,2)}%"></span><span class="vl">${v}</span></div>`;
  }).join('');
}

/* ================= 竞赛查询 ================= */
const F = {yearScope:'all', levels:new Set(), college:'', contest:'', kw:''};
let _filtered=[], _page=1; const PAGE=50;

function buildFilters(){
  const colleges = uniq(records.flatMap(r=>r.college)).sort();
  const scopes=[['all','全部'],['recent','近三年(2024-2026)'],['2026','2026'],['2025','2025'],['2024','2024'],['pre','2023及以前']];
  const lvs=['国家级','省级','校级','国际级','市级','其他'];
  return `
  <div class="card" style="margin-bottom:18px">
    <div class="filters">
      <div class="fld"><label>年份范围</label>
        <select id="f-scope">${scopes.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div>
      <div class="fld"><label>学院</label>
        <select id="f-college"><option value="">全部学院</option>${colleges.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
      <div class="fld"><label>赛事关键词</label>
        <input type="text" id="f-contest" placeholder="如：数学 / 电商 / 统计"></div>
      <div class="fld"><label>全文搜索</label>
        <input type="text" id="f-kw" placeholder="奖项/项目/师生姓名"></div>
    </div>
    <div class="filters">
      <div class="fld"><label>奖项级别</label>
        <div class="chk">${lvs.map(l=>`<label><input type="checkbox" value="${l}">${l}</label>`).join('')}</div></div>
      <button class="btn" id="f-apply">查询</button>
      <button class="btn ghost" id="f-reset">重置</button>
      <span class="small muted" id="f-count" style="margin-left:auto"></span>
    </div>
  </div>`;
}

function applyFilter(){
  const scope=F.yearScope;
  _filtered = records.filter(r=>{
    if(scope==='recent' && !(r.year>=2024)) return false;
    if(scope==='pre' && r.year>=2024) return false;
    if(['2026','2025','2024'].includes(scope) && r.year!=+scope) return false;
    if(F.college && !(r.college||[]).includes(F.college)) return false;
    if(F.contest && !(r.contest||'').includes(F.contest) && !(r.series||'').includes(F.contest)) return false;
    if(F.levels.size && !F.levels.has(r.level)) return false;
    if(F.kw){
      const hay=[r.contest,r.title,r.project,...(r.students||[]),...(r.teachers||[]),r.award].join(' ');
      if(!hay.includes(F.kw)) return false;
    }
    return true;
  });
  _page=1;
  renderTable();
}

function renderTable(){
  const total=_filtered.length;
  const pages=Math.max(1,Math.ceil(total/PAGE));
  _page=Math.min(_page,pages);
  const slice=_filtered.slice((_page-1)*PAGE,_page*PAGE);
  $('#f-count').textContent=`共 ${total} 条结果`;
  const rows = slice.map((r,i)=>{
    const idx=(_page-1)*PAGE+i;
    const stuN=(r.students||[]).length, teaN=(r.teachers||[]).length;
    return `<tr data-idx="${idx}">
      <td>${r.year??'-'}</td>
      <td>${esc(r.contest||r.series||'未命名赛事')}</td>
      <td><span class="tag lv-${r.level}">${r.level}</span></td>
      <td>${esc(r.award||'-')}</td>
      <td>${(r.college||[]).map(c=>`<span class="pill">${esc(c)}</span>`).join('')||'-'}</td>
      <td class="small">👥${stuN} · 👨‍🏫${teaN}</td>
    </tr>
    <tr class="drow" id="d-${idx}" style="display:none"><td colspan="6"><div class="detail">${detailHtml(r)}</div></td></tr>`;
  }).join('');
  $('#tbl-body').innerHTML = rows || `<tr><td colspan="6" class="empty">没有匹配的记录，试试放宽筛选条件。</td></tr>`;
  $$('#tbl-body tr[data-idx]').forEach(tr=>tr.onclick=()=>{
    const d=$('#d-'+tr.dataset.idx);
    d.style.display = d.style.display==='none'?'table-row':'none';
  });
  // 分页
  let pg=`<button class="btn ghost" ${_page<=1?'disabled':''} id="pg-prev">上一页</button>
    <span class="small">第 ${_page} / ${pages} 页</span>
    <button class="btn ghost" ${_page>=pages?'disabled':''} id="pg-next">下一页</button>`;
  $('#pager').innerHTML=pg;
  const pv=$('#pg-prev'),nx=$('#pg-next');
  if(pv)pv.onclick=()=>{_page--;renderTable();};
  if(nx)nx.onclick=()=>{_page++;renderTable();};
}

function detailHtml(r){
  let h=`<div class="row"><b>赛事：</b>${esc(r.contest||'-')} ${r.series?` <span class="small muted">（系列：${esc(r.series)}）</span>`:''}</div>`;
  h+=`<div class="row"><b>年份：</b>${r.year??'-'}　<b>级别：</b>${r.level}　<b>奖项：</b>${esc(r.award||'-')}</div>`;
  h+=`<div class="row"><b>学院：</b>${(r.college||[]).join('、')||'-'}</div>`;
  if(r.project)h+=`<div class="row"><b>项目名称：</b>${esc(r.project)}</div>`;
  if(r.students&&r.students.length)h+=`<div class="row"><b>参赛学生：</b>${r.students.map(esc).join('、')}</div>`;
  if(r.teachers&&r.teachers.length)h+=`<div class="row"><b>指导老师：</b>${r.teachers.map(esc).join('、')}</div>`;
  if(r.title)h+=`<div class="row"><b>来源标题：</b>${esc(r.title)}</div>`;
  if(r.url)h+=`<div class="row"><a href="${esc(r.url)}" target="_blank" rel="noopener">查看官方原文 ↗</a></div>`;
  return h;
}

    $$('#rp-seg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
    RP.tab=b.dataset.t;RP.year='';RP.college='';RP.kw='';
    $('#rp-year').value='';$('#rp-college').value='';$('#rp-kw').value='';
    drawResearch();
  });
  $('#rp-year').onchange=e=>RP.year=e.target.value;
  $('#rp-college').onchange=e=>RP.college=e.target.value;
  $('#rp-kw').oninput=e=>RP.kw=e.target.value.trim();
  $('#rp-go').onclick=drawResearch;

function drawResearch(){
  if(RP.tab==='papers'){
    let list=papers.filter(p=>(!RP.year||p.year===RP.year)&&(!RP.college||p.college===RP.college)&&
      (!RP.kw||(p.title+p.author+p.journal).includes(RP.kw)));
    list.sort((a,b)=>(b.year||'').localeCompare(a.year||''));
    $('#rp-list').innerHTML = list.length? list.map(p=>`
      <div class="detail" style="margin:8px 0;border-left-color:#06b6d4">
        <div><b>${esc(p.title)}</b></div>
        <div class="small muted">${esc(p.author||'')} · ${p.journal?`《${esc(p.journal)}》`:'期刊未注明'} · ${p.year||'年份未注明'} ${p.college?`· ${esc(p.college)}`:''}</div>
      </div>`).join('') : '<div class="empty">没有匹配的论文。</div>';
  }else{
    let list=patents.filter(p=>(!RP.college||p.college===RP.college)&&
      (!RP.kw||(p.name+p.owner+p.no).includes(RP.kw)));
    $('#rp-list').innerHTML = list.length? list.map(p=>`
      <div class="detail" style="margin:8px 0;border-left-color:#f59e0b">
        <div><b>${esc(p.name)}</b></div>
        <div class="small muted">类型：${esc(p.type)} · 权利人：${esc(p.owner||'未注明')} ${p.no?`· 号：${esc(p.no)}`:''} ${p.college?`· ${esc(p.college)}`:''}</div>
      </div>`).join('') : '<div class="empty">没有匹配的专利。</div>';
    if(!patents.length)$('#rp-list').innerHTML+='<div class="note">⚠️ 官网未系统公示专利信息，当前仅从教师简介页挖掘到少量样本，不具备统计代表性。如需完整专利清单，建议对接国家知识产权局或学校科研处数据库。</div>';
  }
}
